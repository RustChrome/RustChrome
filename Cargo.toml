[workspace]
# The Windows shell and the shared core are workspace members. This directory
# stays the workspace root package, so `cargo build --release` here still
# produces target/release/rustchrome exactly as before — the Linux release path
# is unchanged.
members = ["crates/rc-core", "crates/rc-windows"]
resolver = "2"

[package]
name = "rustchrome"
version = "0.1.0"
edition = "2021"

[dependencies]
rc-core = { path = "crates/rc-core" }
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
