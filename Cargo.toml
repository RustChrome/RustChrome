[package]
name = "rustchrome"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = { version = "2.0", features = ["v2_40"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
