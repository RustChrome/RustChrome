[package]
name = "rustchrome-win"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "RustChrome for Windows — Win32 shell over Microsoft Edge WebView2."
build = "build.rs"

[[bin]]
name = "rustchrome"
path = "src/main.rs"

[dependencies]
rc-core = { path = "../rc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
